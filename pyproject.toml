[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gemini_agents"
version = "0.1.0"
description = "A collection of gemini agent examples and experiments"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
dependencies = [
    "google-genai",
    "python-dotenv",
    "loguru",
    "questionary",
    "websockets",
    "pydantic",
    "python-telegram-bot",
    "fastapi",
    "uvicorn",
    "requests",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
gemini-gateway = "agents.gateway:main"
gemini-agent = "agents.agent:main"
gemini-agent-cli = "agents.channels.cli:main"
owlet = "agents.commands.owlet:main"

[tool.ruff]
line-length = 88
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
